<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Manga Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <div class="nav-container">
            <div class="logo">MangaSpace</div>
            <nav>
                <a href="#">Home</a>
                <a href="#">Latest Comics</a>
            </nav>
        </div>
    </header>

    <!-- Main Grid -->
    <main>
        <h2 class="section-title">Latest Updates</h2>
        <!-- This grid is populated automatically by GitHub -->
        <div class="manga-grid" id="comic-grid">
            <p style="color:#aaa; padding: 20px;">Loading comics automatically...</p>
        </div>
    </main>

    <!-- Cinematic Reader Modal (Hidden by default) -->
    <div id="reader-modal" class="modal">
        <div class="modal-header">
            <h3 id="reader-title">Chapter Title</h3>
            <button class="close-btn" onclick="closeReader()">Close Reader (X)</button>
        </div>
        <!-- The comic image will be injected here -->
        <div class="modal-content" id="reader-content"></div>
    </div>

    <!-- Automation Script -->
    <script>
        // --- CONFIGURE THIS ---
        const username = "Prateek1369"; // <-- Change this to Prateek1369
        const repo = "my-portfolio";

        // Opens the dark mode reader on the screen
        function openReader(imgUrl, title) {
            document.getElementById('reader-modal').style.display = 'block';
            document.getElementById('reader-title').innerText = title;
            document.getElementById('reader-content').innerHTML = `<img src="${imgUrl}" alt="${title}">`;
            document.body.style.overflow = 'hidden'; // Stop the background from scrolling
        }

        // Closes the reader
        function closeReader() {
            document.getElementById('reader-modal').style.display = 'none';
            document.getElementById('reader-content').innerHTML = '';
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        // Fetch files from GitHub
        function loadFiles() {
            fetch(`https://api.github.com/repos/${username}/${repo}/contents/comics`)
                .then(response => response.json())
                .then(files => {
                    const grid = document.getElementById('comic-grid');
                    grid.innerHTML = "";
                    
                    files.forEach(file => {
                        if (file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                            // Clean up the name for the title
                            const title = file.name.split('.')[0].replace(/-/g, ' '); 
                            
                            // Generate the Manga Card UI
                            grid.innerHTML += `
                            <div class="manga-card" onclick="openReader('${file.download_url}', '${title}')">
                                <div class="cover-wrapper">
                                    <img src="${file.download_url}" alt="${title}" class="manga-cover">
                                    <div class="chapter-badge">New</div>
                                </div>
                                <div class="manga-info">
                                    <h3 class="manga-title">${title}</h3>
                                </div>
                            </div>`;
                        }
                    });
                })
                .catch(error => {
                    document.getElementById('comic-grid').innerHTML = "<p>Couldn't load files. Check your GitHub username in the code.</p>";
                });
        }

        // Run the script
        loadFiles();
    </script>
</body>
</html>
